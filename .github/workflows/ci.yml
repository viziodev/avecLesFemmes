name: Vérification du premier incrément
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run version:check
      - run: npm run test:version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run openapi --workspace @aveclesfemmes/api
      - run: npm run contracts:generate
      - run: git diff --exit-code -- docs/openapi.json packages/api-client/src/schema.d.ts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run setup
      - run: docker compose build
      - run: docker compose up -d --wait db api super-admin-web membres-pwa
      - run: docker compose --profile demo run --rm seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Vérifier le conteneur unique Render
        run: |
          docker compose --profile render-test build render-test
          docker compose --profile render-test up -d --wait render-test
          WEB_URL=http://localhost:8087/admin/ PWA_URL=http://localhost:8087 npm run test:e2e -- --grep-invert "connexion par code téléphone"
      - name: Logs si échec
        if: failure()
        run: docker compose logs --tail 100
      - name: Nettoyage des services CI
        if: always()
        run: docker compose --profile render-test down
  publish:
    name: Publication des images versionnées
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run release:check
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Préparer le nom du registre
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'REGISTRY_NAMESPACE=ghcr.io/' + process.env.GITHUB_REPOSITORY.toLowerCase() + '\n')"
      - run: npm run release:publish
      - uses: actions/upload-artifact@v4
        with:
          name: manifeste-${{ github.ref_name }}
          path: .releases/*.registry.json
          include-hidden-files: true
          if-no-files-found: error
