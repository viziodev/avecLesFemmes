name: Vérification du premier incrément
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run version:check
      - run: npm run test:version
      - run: node --test scripts/deploy-render.test.mjs
      - name: Vérifier la version de la modification
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-version.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run openapi --workspace @aveclesfemmes/api
      - run: npm run contracts:generate
      - run: git diff --exit-code -- docs/openapi.json packages/api-client/src/schema.d.ts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run setup
      - run: docker compose build
      - run: docker compose up -d --wait db api super-admin-web membres-pwa
      - run: docker compose --profile demo run --rm seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Vérifier le conteneur unique Render
        run: |
          docker compose --profile render-test build render-test
          docker compose --profile render-test up -d --wait render-test
          WEB_URL=http://localhost:8087/admin/ PWA_URL=http://localhost:8087 npm run test:e2e -- --grep-invert "connexion par code téléphone"
      - name: Logs si échec
        if: failure()
        run: docker compose logs --tail 100
      - name: Nettoyage des services CI
        if: always()
        run: docker compose --profile render-test down
  release:
    name: Préparer la version
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        run: node scripts/auto-release.mjs
  publish:
    name: Publication des images versionnées
    needs: [verify, release]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: env GITHUB_REF_NAME='${{ needs.release.outputs.tag }}' npm run release:check
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Préparer le nom du registre
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'REGISTRY_NAMESPACE=ghcr.io/' + process.env.GITHUB_REPOSITORY.toLowerCase() + '\n')"
      - run: env GITHUB_REF_NAME='${{ needs.release.outputs.tag }}' npm run release:publish
      - uses: actions/upload-artifact@v4
        with:
          name: manifeste-${{ needs.release.outputs.tag }}
          path: .releases/*.registry.json
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    name: Déployer le test Render gratuit
    needs: [release, publish]
    runs-on: ubuntu-latest
    environment: render-test
    concurrency:
      group: render-test-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: manifeste-${{ needs.release.outputs.tag }}
          path: .releases
      - name: Déployer et vérifier la version
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
          MIGRATIONS_READY_VERSION: ${{ vars.MIGRATIONS_READY_VERSION }}
          INITIAL_DEPLOY: ${{ vars.INITIAL_DEPLOY }}
        run: node scripts/deploy-render.mjs
