map $http_x_forwarded_proto $forwarded_proto {
 default $scheme;
 https https;
}
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
  include /etc/nginx/alf-security-headers.conf;
 location = /healthz { access_log off; return 200 'ok'; }
 location /api/ {
  proxy_pass ${API_SCHEME}://${API_UPSTREAM};
  proxy_set_header Host $proxy_host;
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  # Discard visitor-supplied forwarding data. Upstream account quotas also
  # distinguish users behind a shared Render/Dokploy ingress.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_no_cache 1;
  proxy_cache_bypass 1;
 }
 location /assets/ { expires 1y; include /etc/nginx/alf-security-headers.conf; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; include /etc/nginx/alf-security-headers.conf; add_header Cache-Control "no-cache"; }
}
