pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 access_log /dev/stdout;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
 server {
  listen 8080;
  server_name _;
  root /app/static/membres;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ {
   proxy_pass http://127.0.0.1:3000;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $forwarded_proto;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /admin { return 302 /admin/; }
  location /admin/ { root /app/static; try_files $uri $uri/ /admin/index.html; add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
 }
}
