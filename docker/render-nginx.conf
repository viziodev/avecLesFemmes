pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 access_log /dev/stdout;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
 server {
  listen 8080;
  server_name _;
  root /app/static/membres;
  include /etc/nginx/alf-security-headers.conf;
  location /api/ {
   proxy_pass http://127.0.0.1:3000;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $forwarded_proto;
   # Discard visitor-supplied forwarding data. Upstream account quotas also
  # distinguish users behind a shared Render/Dokploy ingress.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  }
  location = /admin { return 302 /admin/; }
  location /admin/ { root /app/static; try_files $uri $uri/ /admin/index.html; include /etc/nginx/alf-security-headers.conf; add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; include /etc/nginx/alf-security-headers.conf; add_header Cache-Control "no-cache"; }
 }
}
